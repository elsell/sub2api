name: Fork container
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: fork-container
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/elsell/sub2api:git-${{ github.sha }}
          build-args: |
            COMMIT=${{ github.sha }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=https://github.com/elsell/sub2api
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/elsell/sub2api@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
